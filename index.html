<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CPPG CBT 기출문제 풀이</title>
  <style>
    :root { --primary: #2563eb; --danger: #dc2626; --bg: #f8fafc; }
    body { font-family: -apple-system, sans-serif; background: var(--bg); margin: 0; padding: 20px; color: #1e293b; }
    .container { max-width: 800px; margin: 0 auto; background: white; padding: 24px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
    .btn { background: var(--primary); color: white; border: none; padding: 10px 18px; border-radius: 6px; cursor: pointer; font-weight: bold; margin-right: 8px; }
    .btn:hover { opacity: 0.9; }
    .btn-danger { background: var(--danger); }
    .card { background: #f1f5f9; padding: 16px; border-radius: 8px; margin-bottom: 16px; }
    .option-btn { display: block; width: 100%; text-align: left; background: white; border: 1px solid #cbd5e1; padding: 12px; margin: 8px 0; border-radius: 6px; cursor: pointer; }
    .option-btn.selected { border-color: var(--primary); background: #eff6ff; font-weight: bold; }
    .option-btn.correct { background: #dcfce7; border-color: #16a34a; }
    .option-btn.incorrect { background: #fee2e2; border-color: var(--danger); }
    .explanation { background: #fef3c7; border-left: 4px solid #f59e0b; padding: 12px; margin-top: 12px; border-radius: 4px; }
    .hidden { display: none; }
    .progress-bar { height: 8px; background: #e2e8f0; border-radius: 4px; overflow: hidden; margin-bottom: 16px; }
    .progress-fill { height: 100%; background: var(--primary); width: 0%; transition: width 0.3s; }
  </style>
</head>
<body>
  <div class="container">
    <!-- 메뉴 화면 -->
    <div id="menu-screen">
      <h1>CPPG CBT 시험 모의고사</h1>
      <p>총 문제 수: <strong id="total-db-count">0</strong>개 중복 없음</p>
      <div class="card">
        <h3>풀이 모드 선택</h3>
        <button class="btn" onclick="startQuiz(10)">10문항 빠른 풀이</button>
        <button class="btn" onclick="startQuiz(100)">100문항 실전 모의고사</button>
        <button class="btn btn-danger" onclick="startWrongQuiz()">오답노트 (<span id="wrong-count">0</span>개)</button>
      </div>
    </div>

    <!-- 문제 풀이 화면 -->
    <div id="quiz-screen" class="hidden">
      <div class="progress-bar"><div id="progress" class="progress-fill"></div></div>
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <span id="quiz-status">문제 1 / 10</span>
        <button class="btn btn-danger" onclick="exitQuiz()">exit</button>
      </div>
      <div id="question-box" class="card" style="margin-top: 12px;"></div>
      <div id="options-box"></div>
      <div id="explanation-box" class="explanation hidden"></div>
      <div style="margin-top: 16px;">
        <button id="submit-btn" class="btn" onclick="checkAnswer()">정답 확인</button>
        <button id="next-btn" class="btn hidden" onclick="nextQuestion()">다음 문제</button>
      </div>
    </div>

    <!-- 결과 화면 -->
    <div id="result-screen" class="hidden">
      <h2>시험 결과</h2>
      <div class="card">
        <p>점수: <strong id="final-score">0</strong> / <span id="max-score">0</span> (<span id="score-percent">0</span>%)</p>
      </div>
      <button class="btn" onclick="showMenu()">메인으로 이동</button>
      <button class="btn btn-danger" onclick="startWrongQuiz()">오답노트 풀기</button>
    </div>
  </div>

  <script src="questions.js"></script>
  <script src="app.js"></script>
</body>
</html>
